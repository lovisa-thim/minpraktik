<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOU DESIGN</title>

<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>
:root {
    --background: #F9E7C9;
    --brown: #3A2606;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background-color: var(--background);
    color: var(--brown);
}

/* Logga */
.logo {
    position: fixed;
    top: 25px;
    right: 55px;

    z-index: 10;

    font-family: 'Merriweather', serif;
    font-weight: 700;
    color: var(--brown);

    text-align: center;
    line-height: 0.85;

    background-color: var(--background);

    padding-left: 25px;
    padding-right: 25px;
}

.logo-main {
    font-size: 95px;
    letter-spacing: 4px;
}

.logo-sub {
    font-size: 52px;
    letter-spacing: 3px;
}

/* Horisontell linje */
.top-line {
    position: fixed;
    top: 145px;
    left: 0;
    width: 100%;
    height: 4px;
    background-color: var(--brown);
    z-index: 1;
    transition: opacity 0.4s ease;
}


/* Meny */
.menu {
    position: fixed;
    top: 240px;
    right: 85px;

    z-index: 10;

    display: flex;
    flex-direction: column;
    gap: 55px;

    font-family: 'Montserrat', sans-serif;
    font-size: 18px;

    align-items: center;
    text-align: center;

    width: 220px;
}

.menu a {
    color: var(--brown);
    text-decoration: none;
    font-weight: 400;

    display: flex;
    justify-content: center;
    align-items: center;

    width: 180px;
    height: 24px;
}

.menu a:hover {
    font-weight: 700;
}

/* Bildområde */
.gallery {
    width: calc(100% - 520px);
    margin-left: 8%;
    padding-top: 190px;
    padding-bottom: 120px;

    display: grid;
    grid-template-columns: repeat(2, minmax(220px, 1fr));
    gap: 40px 45px;
    align-items: start;
}

/* Lite asymmetri */
.image-card:nth-child(2n) {
    margin-top: 35px;
}

.image-card:nth-child(3n) {
    margin-top: -10px;
}

.image-card {
    position: relative;
    width: 100%;
    overflow: visible;

    transition: transform 0.3s ease;
}

.image-card:hover {
    transform: translateY(-4px);
}

.image-card:nth-child(2) {
    width: 78%;
    margin-top: 110px;
}

.image-card img {
    width: 100%;
    display: block;
    opacity: 1;
    transition: opacity 0.3s ease;
}

.overlay {
    position: absolute;
    inset: 0;
    background-color: white;
    opacity: 0;
    transition: opacity 0.3s ease;

    display: flex;
    justify-content: center;
    align-items: center;

    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

.image-card:hover img {
    opacity: 0;
}

.image-card:hover .overlay {
    opacity: 1;
}

.overlay-text {
    font-family: 'Montserrat', sans-serif;
    font-size: 18px;
    color: black;
    text-align: center;
}

/* Responsivt */
@media (max-width: 900px) {
    .logo {
        position: absolute;
        right: 25px;
        top: 25px;
    }

    .logo-main {
        font-size: 62px;
    }

    .logo-sub {
        font-size: 34px;
    }

    .top-line {
        top: 120px;
        width: 65%;
    }

    .menu {
        position: absolute;
        top: 170px;
        right: 35px;
        gap: 25px;
        font-size: 15px;
    }

    .gallery {
        width: 80%;
        margin-left: 6%;
        padding-top: 260px;
        grid-template-columns: 1fr;
    }

    .image-card:nth-child(n) {
        margin-top: 0;
    }
}
</style>
</head>

<body>

<div class="top-line" id="topLine"></div>

<header class="logo">
    <div class="logo-main">LOU</div>
    <div class="logo-sub">DESIGN</div>
</header>

<nav class="menu">
    <a href="#">THE LAMP</a>
    <a href="#">THE CHAIR</a>
    <a href="#">ABOUT</a>
    <a href="#">CONTACT</a>
</nav>

<main class="gallery">

    <div class="image-card">
        <img src="bild1.jpg" alt="The lamp">
        <div class="overlay">
            <div class="overlay-text">1 000 000$</div>
        </div>
    </div>

    <div class="image-card">
        <img src="bild2.jpg" alt="The chair">
        <div class="overlay">
            <div class="overlay-text">THE CHAIR</div>
        </div>
    </div>

    <!-- Lägg till fler bilder senare så här:

    <div class="image-card">
        <img src="bild3.jpg" alt="Ny bild">
        <div class="overlay">
            <div class="overlay-text">NY TEXT</div>
        </div>
    </div>

    -->

</main>

<script>
window.addEventListener("scroll", function() {
    const line = document.getElementById("topLine");
    const scrollAmount = window.scrollY;

    if (scrollAmount > 80) {
        line.style.opacity = "0";
    } else {
        line.style.opacity = "1";
    }
});
</script>

</body>
</html>
